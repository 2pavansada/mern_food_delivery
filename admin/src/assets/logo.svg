<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(2, 4)">
    <rect width="40" height="40" rx="12" fill="#F97316"/>
    <!-- Bowl base -->
    <path d="M10 20C10 27.5 14.5 31.5 20 31.5C25.5 31.5 30 27.5 30 20H10Z" fill="#FFF7ED"/>
    <!-- Smile in bowl -->
