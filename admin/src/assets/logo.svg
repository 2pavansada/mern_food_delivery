    <!-- Steam -->
    <path d="M14 15C14 12 16 11 16 9" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 15C20 11 22 10 22 8" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 15C26 12 28 11 28 9" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
